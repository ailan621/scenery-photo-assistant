<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfa">
<title>对话 · 风景拍摄与视频优化助手</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
  :root {
    --ink: #16181d;
    --sub: #6b7280;
    --faint: #9aa1ab;
    --line: #e8e6e1;
    --bg: #fcfcfa;
    --bubble: #f2f0ec;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    height: 100dvh;
  }

  header {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    border-bottom: 1px solid var(--line);
    background: rgba(252, 252, 250, .92);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .3px; flex: 1; }
  header .back {
    font-size: 13px; color: var(--sub); text-decoration: none;
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px;
  }
  header .back:hover { color: var(--ink); }
  header .reset {
    font-size: 13px; color: var(--sub); background: none; border: none;
    cursor: pointer; padding: 5px 4px; font-family: inherit;
  }
  header .reset:hover { color: var(--ink); }

  #log {
    flex: 1; overflow-y: auto; padding: 22px 20px 8px;
    scroll-behavior: smooth;
  }
  .row { max-width: 760px; margin: 0 auto 18px; display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: 86%; padding: 11px 15px; border-radius: 14px;
    font-size: 15px; line-height: 1.72;
    white-space: pre-wrap; word-break: break-word;
  }
  .me .bubble { background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--bubble); border-bottom-left-radius: 4px; }
  .bubble img { max-width: 200px; border-radius: 10px; display: block; margin-bottom: 6px; }
  .bot .bubble.err { color: #b42318; background: #fdf2f0; }

  .dots { display: inline-flex; gap: 4px; align-items: center; height: 20px; }
  .dots i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--faint);
    animation: blink 1.2s infinite;
  }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .28 } 30% { opacity: 1 } }

  .hint {
    max-width: 760px; margin: 0 auto 14px; text-align: center;
    font-size: 13px; color: var(--faint); line-height: 1.9;
  }

  .composer {
    flex: none;
    border-top: 1px solid var(--line);
    background: var(--bg);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  }
  .inner { max-width: 760px; margin: 0 auto; }
  .attach {
    display: none; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: 13px; color: var(--sub);
  }
  .attach.on { display: flex; }
  .attach img { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .attach button {
    background: none; border: none; color: var(--sub); cursor: pointer;
    font-size: 13px; text-decoration: underline; text-underline-offset: 3px;
  }
  .bar { display: flex; align-items: flex-end; gap: 10px; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; font-size: 15px; line-height: 1.5; font-family: inherit;
    background: #fff; color: var(--ink); max-height: 140px; outline: none;
  }
  textarea:focus { border-color: #c9c5bd; }
  .icon {
    flex: none; width: 42px; height: 42px; border-radius: 12px;
    border: 1px solid var(--line); background: #fff; color: var(--sub);
    cursor: pointer; font-size: 17px; line-height: 1;
  }
  .icon:hover { color: var(--ink); }
  .send {
    flex: none; height: 42px; padding: 0 20px; border-radius: 12px;
    border: none; background: var(--ink); color: #fff; font-size: 14px;
    font-family: inherit; cursor: pointer;
  }
  .send:disabled { opacity: .35; cursor: default; }

  @media (max-width: 520px) {
    header { padding-left: 16px; padding-right: 16px; }
    #log { padding: 18px 16px 6px; }
    .composer { padding-left: 16px; padding-right: 16px; }
    .bubble { font-size: 15px; max-width: 90%; }
  }
</style>
</head>
<body>

<header>
  <h1>风景拍摄与视频优化助手</h1>
  <button class="reset" id="resetBtn">新对话</button>
  <a class="back" href="./index.html">返回</a>
</header>

<div id="log">
  <p class="hint" id="hint">拍摄参数、机位时间、照片打分、视频发布<br>直接在下面问就行</p>
</div>

<div class="composer">
  <div class="inner">
    <div class="attach" id="attachBox">
      <img id="attachThumb" alt="">
      <span id="attachName"></span>
      <button type="button" id="attachClear">移除</button>
    </div>
    <div class="bar">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button class="icon" id="pickBtn" title="上传照片">＋</button>
      <textarea id="input" rows="1" placeholder="说说你想拍什么，或传张照片让我看看"></textarea>
      <button class="send" id="sendBtn">发送</button>
    </div>
  </div>
</div>

<script src="./chat-config.js"></script>
<script>
(function () {
  var API = (window.CHAT_API || '').replace(/\/$/, '');
  var log = document.getElementById('log');
  var hint = document.getElementById('hint');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var pickBtn = document.getElementById('pickBtn');
  var fileInput = document.getElementById('fileInput');
  var attachBox = document.getElementById('attachBox');
  var attachThumb = document.getElementById('attachThumb');
  var attachName = document.getElementById('attachName');
  var resetBtn = document.getElementById('resetBtn');

  var convId = null;
  var busy = false;
  var fileId = null;
  var fileObj = null;

  var uid = (function () {
    try {
      var k = 'scenery_uid';
      var v = localStorage.getItem(k);
      if (!v) { v = 'u' + Math.random().toString(36).slice(2, 10); localStorage.setItem(k, v); }
      return v;
    } catch (e) { return 'u' + Math.random().toString(36).slice(2, 10); }
  })();

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function addRow(who) {
    var row = el('div', 'row ' + who);
    var b = el('div', 'bubble');
    row.appendChild(b);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  function atBottom() {
    return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  }
  function keepBottom(force) {
    if (force || atBottom()) log.scrollTop = log.scrollHeight;
  }

  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);
  resetBtn.addEventListener('click', function () {
    convId = null;
    fileId = null; fileObj = null;
    attachBox.classList.remove('on');
    Array.prototype.slice.call(log.querySelectorAll('.row')).forEach(function (r) { r.remove(); });
    hint.style.display = '';
  });

  pickBtn.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) { alert('图片不能超过 10MB'); return; }
    fileObj = f;
    fileId = null;
    attachName.textContent = f.name;
    attachThumb.src = URL.createObjectURL(f);
    attachBox.classList.add('on');
  });
  document.getElementById('attachClear').addEventListener('click', function () {
    fileObj = null; fileId = null; fileInput.value = '';
    attachBox.classList.remove('on');
  });

  async function upload() {
    var fd = new FormData();
    fd.append('file', fileObj, fileObj.name || 'image.jpg');
    var r = await fetch(API + '/api/upload', { method: 'POST', body: fd });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok || !d.file_id) throw new Error(d.error || '图片上传失败');
    return d.file_id;
  }

  async function send() {
    if (busy) return;
    var text = input.value.trim();
    if (!text && !fileObj) return;
    if (!API) { alert('接口地址未配置'); return; }

    hint.style.display = 'none';
    busy = true;
    sendBtn.disabled = true;

    var myBubble = addRow('me');
    if (fileObj) {
      var img = el('img');
      img.src = URL.createObjectURL(fileObj);
      myBubble.appendChild(img);
    }
    if (text) myBubble.appendChild(document.createTextNode(text));

    var sentFile = fileObj;
    input.value = '';
    input.style.height = 'auto';

    var botBubble = addRow('bot');
    var dots = el('span', 'dots');
    dots.innerHTML = '<i></i><i></i><i></i>';
    botBubble.appendChild(dots);

    var acc = '';
    var started = false;

    function paint(chunk) {
      if (!started) { botBubble.innerHTML = ''; started = true; }
      acc += chunk;
      botBubble.textContent = acc;
      keepBottom(false);
    }
    function fail(msg) {
      if (!started) { botBubble.innerHTML = ''; started = true; }
      botBubble.className = 'bubble err';
      botBubble.textContent = msg;
    }

    try {
      if (sentFile && !fileId) fileId = await upload();

      var payload = { message: text, user_id: uid };
      if (convId) payload.conversation_id = convId;
      if (fileId) payload.file_id = fileId;

      var res = await fetch(API + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        var e = await res.json().catch(function () { return {}; });
        throw new Error(e.error || ('请求失败 ' + res.status));
      }

      var reader = res.body.getReader();
      var dec = new TextDecoder('utf-8');
      var buf = '';

      while (true) {
        var r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });

        var i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          var block = buf.slice(0, i);
          buf = buf.slice(i + 2);
          handle(block);
        }
      }
      if (buf.trim()) handle(buf);
    } catch (err) {
      fail(err.message || '服务暂时不可用，请稍后再试');
    } finally {
      if (!started) {
        fail('这次没有拿到内容，换个说法再问一次试试。');
      }
      busy = false;
      sendBtn.disabled = false;
      fileObj = null; fileId = null; fileInput.value = '';
      attachBox.classList.remove('on');
      input.focus();
      keepBottom(true);
    }

    function handle(block) {
      var ev = '';
      var dataLine = '';
      block.split('\n').forEach(function (line) {
        if (line.indexOf('event:') === 0) ev = line.slice(6).trim();
        else if (line.indexOf('data:') === 0) dataLine += line.slice(5).trim();
      });
      if (!dataLine) return;

      var d;
      try { d = JSON.parse(dataLine); } catch (e) { return; }

      if (d.conversation_id && !convId) convId = d.conversation_id;

      if (ev === 'conversation.message.delta' && d.type === 'answer' && d.content) {
        paint(d.content);
      } else if (ev === 'conversation.message.completed' && d.type === 'answer') {
        if (!acc && d.content) paint(d.content);
      } else if (ev === 'conversation.chat.failed') {
        fail('生成失败，稍后再试一次。');
      } else if (d.status === 'failed') {
        fail('生成失败，稍后再试一次。');
      }
    }
  }

  window.addEventListener('load', function () { keepBottom(true); });
})();
</script>
</body>
</html>
