<!-- 图标 -->
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<!-- 微信/社交平台分享卡片 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="风景拍摄与视频优化助手">
<meta property="og:title" content="风景拍摄与视频优化助手">

<meta property="og:image" content="https://ailan621.github.io/scenery-photo-assistant/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --ink: #16181d;
    --faint: #9aa1ab;
    --bg: #fcfcfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 680px; width: 100%; margin: 0 auto; padding: 0 28px;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .spacer { flex: 1; }
  h1 { font-size: 30px; line-height: 1.45; font-weight: 600; letter-spacing: .5px; margin-bottom: 36px; }
  .btn-main {
    display: inline-block; align-self: flex-start;
    font-size: 15px; font-weight: 500;
    color: #fff; background: var(--ink); border: none; border-radius: 8px;
    padding: 12px 30px; cursor: pointer; transition: background .15s;
  }
  .btn-main:hover { background: #31353c; }
  .meta { margin-top: 60px; font-size: 13px; letter-spacing: .5px; color: var(--faint); }
  footer {
    margin-top: 14px;
    padding-bottom: calc(34px + env(safe-area-inset-bottom));
    font-size: 12px; color: var(--faint);
  }
  footer a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { color: var(--ink); }
  .stats { margin-left: 6px; }
  @media (max-width: 520px) {
    h1 { font-size: 24px; line-height: 1.5; margin-bottom: 30px; }
    .meta { margin-top: 44px; }
    footer { padding-bottom: calc(26px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<main class="wrap">
  <div class="spacer"></div>
  <h1>风景拍摄与视频优化助手</h1>
  <button class="btn-main" id="chatBtn" onclick="openChat()">开始对话</button>
  <p class="meta">拍摄咨询 · 照片打分 · 视频与发布建议</p>
  <div class="spacer"></div>
  <footer>
    Powered by Coze · <a href="https://www.coze.cn/store/agent/7681975188829159474?bot_id=true" target="_blank">在扣子商店打开</a><span class="stats" id="siteStats" style="display:none">· 本站访问 <span id="busuanzi_value_site_pv">-</span> 次</span>
  </footer>
</main>

<!-- 访问统计（不蒜子，免费无注册；20 秒内拿不到数据就保持隐藏，不影响页面） -->
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
  (function () {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      var box = document.getElementById('siteStats');
      var v = document.getElementById('busuanzi_value_site_pv');
      if (box && v && /^\d+$/.test((v.textContent || '').trim())) {
        box.style.display = '';
        clearInterval(timer);
      }
      if (tries >= 20) clearInterval(timer);
    }, 1000);
  })();
</script>

<script>
  /* 打开聊天：跳转到独立对话页，由自建接口代理转发，网页端不承载任何访问令牌。 */
  function openChat() {
    window.location.href = './chat.html';
  }
</script>
</body>
</html>
