<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风景拍摄与视频优化助手</title>
<style>
  :root {
    --ink: #16181d;
    --sub: #6f7680;
    --faint: #9aa1ab;
    --line: #e7e7e2;
    --bg: #fcfcfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 24px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 0; border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
  .top-link {
    font-size: 14px; color: var(--ink); background: none; border: none;
    cursor: pointer; padding: 0; border-bottom: 1px solid var(--faint); padding-bottom: 2px;
  }
  .top-link:hover { border-bottom-color: var(--ink); }

  .intro { padding: 92px 0 60px; }
  h1 { font-size: 34px; line-height: 1.4; font-weight: 600; letter-spacing: .5px; margin-bottom: 20px; }
  .sub { font-size: 15px; line-height: 2; color: var(--sub); max-width: 32em; margin-bottom: 40px; }
  .btn-main {
    display: inline-block; font-size: 15px; font-weight: 500;
    color: #fff; background: var(--ink); border: none; border-radius: 8px;
    padding: 12px 30px; cursor: pointer; transition: background .15s;
  }
  .btn-main:hover { background: #31353c; }

  .list { padding-bottom: 72px; }
  .row {
    display: flex; gap: 32px;
    padding: 24px 0; border-top: 1px solid var(--line);
  }
  .row h3 { flex: 0 0 6em; font-size: 14px; font-weight: 600; padding-top: 3px; }
  .row p { font-size: 14px; line-height: 2; color: var(--sub); }

  footer {
    padding: 26px 0 44px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--faint);
  }
  footer a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 520px) {
    .intro { padding: 60px 0 44px; }
    h1 { font-size: 26px; }
    .sub { font-size: 14px; }
    .row { flex-direction: column; gap: 8px; padding: 20px 0; }
    .btn-main { padding: 11px 26px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="brand">风景拍摄助手</span>
    <button class="top-link" onclick="openChat()">开始对话</button>
  </header>

  <section class="intro">
    <h1>风景拍摄与视频优化助手</h1>
    <p class="sub">老玩家拍了多年山川湖海，把经验整理成了这个助手。拍摄上的疑问、照片想听真话、视频不知道怎么发——直接问就行。</p>
    <button class="btn-main" id="chatBtn" onclick="openChat()">开始对话</button>
  </section>

  <section class="list">
    <div class="row">
      <h3>拍摄咨询</h3>
      <p>问「日出怎么拍」「星空怎么拍」，直接给最佳时间、机位、参数和避坑要点，手机相机都照顾。</p>
    </div>
    <div class="row">
      <h3>照片打分</h3>
      <p>发一张照片说「打个分」，十分制严格评分，逐维度说明理由，给最能提分的改进点。</p>
    </div>
    <div class="row">
      <h3>视频与发布</h3>
      <p>怎么剪、几点发、带什么标签——覆盖日出、星空、露营、公路等 20 多个场景。</p>
    </div>
  </section>

  <footer>
    Powered by Coze · <a href="https://www.coze.cn/store/agent/7681975188829159474?bot_id=true" target="_blank">在扣子商店打开</a>
  </footer>
</div>

<script>
  var STORE_URL = 'https://www.coze.cn/store/agent/7681975188829159474?bot_id=true';
  var IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  /* 打开聊天：直接调 SDK 实例自带的 showChatBot() API。
     （SDK 气泡按钮的 DOM 类名是构建哈希，按类名永远找不到，故不依赖气泡。） */
  function openChat() {
    var client = window.chatClient;
    try {
      if (client && typeof client.showChatBot === 'function') {
        client.showChatBot();
        return;
      }
    } catch (e) { console.warn('showChatBot failed', e); }

    /* 兜底1：按屏幕位置点右下角悬浮气泡（不依赖类名） */
    function bubbleAt() {
      var el = document.elementFromPoint(window.innerWidth - 28, window.innerHeight - 44);
      return (el && el.tagName !== 'HTML' && el.tagName !== 'BODY') ? el : null;
    }
    var b = bubbleAt();
    if (b) { b.click(); return; }

    /* 兜底2：SDK 可能仍在加载，轮询最多约 6 秒 */
    var done = false, tries = 0;
    var timer = setInterval(function () {
      tries++;
      var c2 = window.chatClient;
      try {
        if (c2 && typeof c2.showChatBot === 'function') {
          clearInterval(timer); done = true; c2.showChatBot(); return;
        }
      } catch (e) {}
      var el2 = bubbleAt();
      if (el2) { clearInterval(timer); done = true; el2.click(); return; }
      if (tries >= 40) clearInterval(timer);
    }, 150);

    /* 兜底3：始终失败则引导去扣子商店 */
    setTimeout(function () {
      if (done || bubbleAt()) return;
      var c3 = window.chatClient;
      if (c3 && typeof c3.showChatBot === 'function') { try { c3.showChatBot(); } catch (e) {} return; }
      if (confirm('聊天组件加载较慢或失败。\n\n点击「确定」在扣子商店打开对话（需登录扣子账号）。')) {
        window.open(STORE_URL, '_blank');
      }
    }, 6000);
  }
</script>

<!-- 扣子 Chat SDK（官方发布页生成的安装地址） -->
<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
<script>
  try {
    if (typeof CozeWebSDK !== 'undefined') {
      window.chatClient = new CozeWebSDK.WebChatClient({
        config: {
          type: 'bot',
          bot_id: '7681975188829159474'
        },
        auth: {
          type: 'token',
          /* 注意：静态网页方案下令牌必须放前端，属官方 SDK 的既定用法；
             该令牌仅为本演示页专用，有效期至 2026-10-07，到期自动失效。 */
          token: 'pat_M4lR0Llh9fY7fa5SoaGtRZHvG7wLx7D316jgHmJZPdpI0YRU6ppjKMHR5GGHvU0C',
          onRefreshToken: function () { return 'pat_M4lR0Llh9fY7fa5SoaGtRZHvG7wLx7D316jgHmJZPdpI0YRU6ppjKMHR5GGHvU0C'; }
        },
        userInfo: { id: 'visitor', nickname: '访客' },
        ui: {
          base: { layout: IS_MOBILE ? 'mobile' : 'pc', lang: 'zh-CN', zIndex: 9999 },
          header: { isShow: true, isNeedClose: true },
          asstBtn: { isNeed: true },
          footer: { isShow: true, expressionText: 'Powered by Coze' },
          chatBot: IS_MOBILE
            ? { title: '风景拍摄与视频优化助手' }
            : { title: '风景拍摄与视频优化助手', width: 420 }
        }
      });
    }
  } catch (e) { console.warn('SDK init failed', e); }
</script>
</body>
</html>
