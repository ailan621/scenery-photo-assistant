<title>风景拍摄与视频优化助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    color: #1f2937; background: #f6f8fb; min-height: 100vh;
  }
  .hero {
    position: relative; padding: 90px 24px 70px; text-align: center;
    background: linear-gradient(160deg, #0f2b46 0%, #1d4e6b 45%, #3d7ea6 80%, #7fb5cf 100%);
    color: #fff; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 90px;
    background: #f6f8fb;
    clip-path: polygon(0 100%, 100% 100%, 100% 40%, 62% 70%, 30% 30%, 0 75%);
  }
  .hero h1 { font-size: 40px; letter-spacing: 2px; margin-bottom: 16px; font-weight: 700; }
  .hero p.sub { font-size: 17px; opacity: .92; max-width: 560px; margin: 0 auto 34px; line-height: 1.8; }
  .btn-chat {
    display: inline-block; padding: 14px 44px; font-size: 17px; font-weight: 600;
    color: #0f2b46; background: #ffd166; border: none; border-radius: 999px;
    cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: transform .15s, box-shadow .15s;
  }
  .btn-chat:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,.3); }
  .features {
    max-width: 960px; margin: 20px auto 60px; padding: 0 24px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 28px 24px;
    box-shadow: 0 4px 16px rgba(15,43,70,.06); border: 1px solid #eef2f6;
  }
  .card .emoji { font-size: 34px; margin-bottom: 14px; }
  .card h3 { font-size: 18px; margin-bottom: 10px; color: #0f2b46; }
  .card p { font-size: 14px; line-height: 1.9; color: #5b6b7b; }
  .score-bar { display: flex; gap: 6px; margin-top: 12px; }
  .score-bar span {
    flex: 1; text-align: center; font-size: 12px; padding: 6px 2px;
    background: #f0f6fb; border-radius: 8px; color: #35648c;
  }
  footer { text-align: center; padding: 26px 16px 34px; font-size: 13px; color: #9aa7b3; }
  footer a { color: #3d7ea6; text-decoration: none; }
  @media (max-width: 520px) {
    .hero h1 { font-size: 30px; }
    .hero { padding: 64px 18px 56px; }
    .btn-chat { padding: 12px 36px; font-size: 16px; }
    .card { padding: 22px 18px; }
    .card p { font-size: 13px; }
  }
</style>

<body>

<section class="hero">
  <h1>🏔️ 风景拍摄与视频优化助手</h1>

    精通风光摄影的老玩家，拍了多年山川湖海。<br>
    拍摄咨询、照片打分、视频运营，直接问它就行。
  </p>
  <button class="btn-chat" id="chatBtn" onclick="openChat()">💬 开始对话</button>
</section>

<div class="features">

  </div>
  <div class="card">
    <div class="emoji">🖼️</div>
    <h3>照片打分</h3>
    <p>发一张照片说「打个分」，十分制严格评分，逐维度说明理由，还给最能提分的改进点。</p>
    <div class="score-bar"><span>构图3</span><span>光影2</span><span>色彩2</span><span>主体2</span><span>清晰1</span></div>
  </div>
  <div class="card">
    <div class="emoji">🎬</div>
    <h3>视频与发布</h3>
    <p>拍风景视频怎么剪、几点发流量好、带什么标签——覆盖日出、星空、露营、公路等 20+ 场景。</p>
  </div>
</div>

<footer>
  Powered by Coze ·

</footer>

<script>
  var STORE_URL = 'https://www.coze.cn/store/agent/7681975188829159474?bot_id=true';
  var IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  /* 打开聊天：直接调 SDK 实例自带的 showChatBot() API。
     （SDK 气泡按钮的 DOM 类名是构建哈希，按类名永远找不到，这就是之前
     「聊天气泡未找到」弹窗的原因；SDK 源码确认实例上有 showChatBot/hideChatBot。） */
  function openChat() {
    var client = window.chatClient;
    try {
      if (client && typeof client.showChatBot === 'function') {
        client.showChatBot();
        return;
      }
    } catch (e) { console.warn('showChatBot failed', e); }

    /* 兜底1：按屏幕位置点右下角悬浮气泡（不依赖类名） */
    function bubbleAt() {
      var el = document.elementFromPoint(window.innerWidth - 28, window.innerHeight - 44);
      return (el && el.tagName !== 'HTML' && el.tagName !== 'BODY') ? el : null;
    }
    var b = bubbleAt();
    if (b) { b.click(); return; }

    /* 兜底2：SDK 可能仍在加载，轮询最多约 6 秒 */
    var done = false, tries = 0;
    var timer = setInterval(function () {
      tries++;
      var c2 = window.chatClient;
      try {
        if (c2 && typeof c2.showChatBot === 'function') {
          clearInterval(timer); done = true; c2.showChatBot(); return;
        }
      } catch (e) {}
      var el2 = bubbleAt();
      if (el2) { clearInterval(timer); done = true; el2.click(); return; }
      if (tries >= 40) clearInterval(timer);
    }, 150);

    /* 兜底3：始终失败则引导去扣子商店 */
    setTimeout(function () {
      if (done || bubbleAt()) return;
      var c3 = window.chatClient;
      if (c3 && typeof c3.showChatBot === 'function') { try { c3.showChatBot(); } catch (e) {} return; }
      if (confirm('聊天组件加载较慢或失败。\n\n点击「确定」在扣子商店打开对话（需登录扣子账号）。')) {
        window.open(STORE_URL, '_blank');
      }
    }, 6000);
  }
</script>
