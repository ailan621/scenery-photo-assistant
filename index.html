  .score-bar span {
    flex: 1; text-align: center; font-size: 12px; padding: 6px 2px;
    background: #f0f6fb; border-radius: 8px; color: #35648c;
  }
  footer { text-align: center; padding: 26px 16px 34px; font-size: 13px; color: #9aa7b3; }
  footer a { color: #3d7ea6; text-decoration: none; }
  @media (max-width: 520px) { .hero h1 { font-size: 30px; } .hero { padding: 64px 18px 56px; } }
